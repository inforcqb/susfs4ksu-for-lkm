# SPDX-License-Identifier: GPL-2.0-only
name: layering

on:
  push:
    paths:
      - 'kernel/**'
      - 'tools/layer_manifest.json'
      - 'tools/layer_baseline.json'
      - 'tools/layer_allowlist.json'
      - 'tools/layering_check.py'
      - 'tools/test_layering.py'
      - 'tools/susfs_avc_view_test.c'
      - 'tools/susfs_uname_view_test.c'
      - 'tools/susfs_hide_view_test.c'
      - 'tools/sus_mount_identity_view_test.c'
      - 'tools/hk_exec_nx_test.c'
      - '.github/workflows/layering.yml'
  pull_request:
    paths:
      - 'kernel/**'
      - 'tools/layer_manifest.json'
      - 'tools/layer_baseline.json'
      - 'tools/layer_allowlist.json'
      - 'tools/layering_check.py'
      - 'tools/test_layering.py'
      - 'tools/susfs_avc_view_test.c'
      - 'tools/susfs_uname_view_test.c'
      - 'tools/susfs_hide_view_test.c'
      - 'tools/sus_mount_identity_view_test.c'
      - 'tools/hk_exec_nx_test.c'
      - '.github/workflows/layering.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile
        run: python -m py_compile tools/layering_check.py tools/test_layering.py
      - name: Gate tests
        run: python tools/test_layering.py
      - name: sus_mount view host test
        run: |
          cc -std=c11 -Wall -Wextra -I kernel tools/sus_mount_view_test.c -o /tmp/test_sus_mount_view
          /tmp/test_sus_mount_view
      - name: susfs create view host test
        run: |
          cc -std=c11 -Wall -Wextra -I kernel tools/susfs_create_view_test.c -o /tmp/test_susfs_create_view
          /tmp/test_susfs_create_view
      - name: path, open, kstat, avc, uname, hide and mount identity view host tests
        run: |
          set -e
          for test in sus_path_view susfs_open_view susfs_kstat_view susfs_avc_view susfs_uname_view susfs_hide_view sus_mount_identity_view; do
            cc -std=c11 -Wall -Wextra -Werror -I kernel "tools/${test}_test.c" -o "/tmp/test_${test}"
            "/tmp/test_${test}"
          done
      - name: Enforce layering
        run: python tools/layering_check.py --strict
      - name: ARM64 trampoline NX policy host test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I kernel tools/hk_exec_nx_test.c -o /tmp/test_hk_exec_nx
          /tmp/test_hk_exec_nx
